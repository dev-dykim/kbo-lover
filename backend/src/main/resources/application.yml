spring:
  profiles:
    active: local

  datasource:
    url: jdbc:mysql://localhost:3306/kbo_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

collector:
  schedule:
    rate-ms: 30000  # 30초
  use-mock: false   # true로 바꾸면 MockFixtureCollector 사용

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:kbo_db;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
collector:
  use-mock: true
